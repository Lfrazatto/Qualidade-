  <linearGradient id="cab" x2="0" y2="1"><stop stop-color="#347d98"/><stop offset="1" stop-color="#16475e"/></linearGradient>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#5f7c82" stroke-opacity=".16" stroke-width="1"/><circle cx="0" cy="0" r="2" fill="#5f7c82" fill-opacity=".22"/></pattern>
  <pattern id="road" width="52" height="12" patternUnits="userSpaceOnUse"><path d="M0 1H27" stroke="#dce0d8" stroke-opacity=".4" stroke-width="2"/></pattern>
  <filter id="shadow" x="-.1" y="-.2" width="1.3" height="1.5"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
