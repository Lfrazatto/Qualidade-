<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
<title id="t">Caminhão conceitual Rota / Vetor</title>
<desc id="d">Ilustração original de um caminhão pesado articulado diante de um fundo de engenharia em azul, cinza e âmbar. Não representa modelo comercial específico.</desc>
<defs>
